# Construit le site à chaque modification, et le publie sur GitHub Pages
# uniquement depuis la branche par défaut du dépôt.
name: Construction et publication

on:
  push:
  pull_request:
  workflow_dispatch:

# Droits minimaux par défaut ; le job de publication demande les siens.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vérification et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances (versions verrouillées)
        run: npm ci

      - name: Audit de sécurité des dépendances
        run: npm run audit

      - name: Vérification du code
        run: npm run check

      - name: Vérification des photos (aucune coordonnée GPS)
        run: npm run check:images

      - name: Adresse du site GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
        continue-on-error: true

      - name: Construction
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Publication sur GitHub Pages
    needs: build
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
